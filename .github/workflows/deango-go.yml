name: deango-go

on:
  push:
    paths:
      - 'deango-go/**'
      - '.github/workflows/deango-go.yml'
  workflow_dispatch:

permissions:
  contents: write # required for the gofmt auto-fix push-back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: gofmt auto-fix (pushes formatting commit if needed)
        run: |
          gofmt -w deango-go
          if ! git diff --quiet -- deango-go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add deango-go
            git commit -m "gofmt: auto-format deango-go (CI)"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed formatting commit"
          else
            echo "already formatted"
          fi

      - name: gofmt check
        working-directory: deango-go
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: deango-go
        run: go vet ./...

      - name: build (host)
        working-directory: deango-go
        run: go build ./...

      - name: smoke test — CLI JSON contract
        working-directory: deango-go
        run: |
          go build -o /tmp/deango ./cmd/deango
          /tmp/deango version | tee /tmp/version.json
          /tmp/deango detect > /tmp/detect.json
          grep -q '"go"' /tmp/version.json
          grep -q '"scannedAt"' /tmp/detect.json

      - name: e2e — Go binary speaks ACP to the mock agent
        run: |
          set -e
          out="$(/tmp/deango probe --cmd "python3 bridge/tests/mock_acp_agent.py" --prompt "ci e2e" --list)"
          echo "$out"
          echo "$out" | grep -q '"ok": true'
          echo "$out" | grep -q '"sessionFork": true'
          echo "$out" | grep -q '"stopReason": "end_turn"'

      - name: cross-compile (linux/windows/darwin × amd64/arm64)
        working-directory: deango-go
        run: |
          set -e
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $target
            out="dist/deango-$1-$2"
            [ "$1" = "windows" ] && out="$out.exe"
            echo "building $out"
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/deango
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deango-binaries
          path: deango-go/dist/
          retention-days: 30
